name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.24", cache: false }
      - name: Format and vet
        run: make vet
      - name: Unit and end-to-end tests
        run: make test
      - name: SQL schema and store tests
        run: make sqltest
      - name: Integration test against PostgreSQL
        env:
          LEDGERLINE_TEST_TENANT: ci
          LEDGERLINE_TEST_OPS_TENANT: ci_ops
        run: |
          psql -d ledgerline_test -c "CREATE ROLE ll_it LOGIN PASSWORD 'll_it' IN ROLE ledgerline_app; INSERT INTO ll.tenant (id, name) VALUES ('ci', 'CI tenant'), ('ci_ops', 'CI operations tenant');"
          go get github.com/jackc/pgx/v5@v5.7.2
          go mod tidy
          LEDGERLINE_TEST_DB="postgres://ll_it:ll_it@localhost:5432/ledgerline_test?sslmode=disable" go test -tags 'integration pgx' -count=1 -v -run Integration ./internal/pgstore
